<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28" width="36" height="28" fill="none">
  <!-- Casing retro Braun -->
  <rect x="1.5" y="1.5" width="33" height="25" rx="6" fill="#FDFBF7" stroke="#1B2B23" stroke-width="2"/>
  <!-- Bezel layar CRT / panel instrumen -->
  <rect x="4.5" y="4.5" width="27" height="19" rx="3.5" stroke="#E2DAD0" stroke-width="1"/>
  <!-- Tracing W monoline instrumen -->
